name: IRAN RADAR

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: iran-radar-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore publication and duplicate-detection state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor selected Telegram channels (30-second polling)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@RadarIranNews'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_MINUTES: '4'
          POLL_SECONDS: '30'
          ALLOW_FALLBACK: '0'
        run: python -u main.py

      - name: Save publication and duplicate-detection state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/seen.json
          key: radar-state-${{ github.run_id }}
