name: Radar News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

# Jobs queue instead of overlapping, so the bot is always running (one job hands over to the next).
concurrency:
  group: radar-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - run: pip install -r requirements.txt

      - name: Run (checks all sources every 30s for 17 minutes)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MINUTES: '17'
          POLL_SECONDS: '30'
        run: python main.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/seen.json
          key: radar-state-${{ github.run_id }}
