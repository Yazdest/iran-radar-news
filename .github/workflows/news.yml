name: IRAN RADAR

on:
  workflow_dispatch:
  schedule:
    # Runs overlap on purpose: a run lasts ~14 minutes and a new one is queued every 10 minutes,
    # so a pending run is always waiting and takes over the moment the previous one ends.
    # (GitHub delays or drops scheduled triggers under load; with 4-minute runs every gap showed up as news delay.)
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: iran-radar-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore publication and duplicate-detection state
        uses: actions/cache/restore@v4
        with:
          path: state/seen.json
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor selected Telegram channels (30-second polling)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@RadarIranNews'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional secret: your own chat id, to receive health alerts from the bot.
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          RUN_MINUTES: '14'
          POLL_SECONDS: '30'
          PUBLISH_INTERVAL_SECONDS: '3'
          # Hard cap for rewriting one story, so a bad AI day cannot push the run past timeout-minutes.
          ITEM_BUDGET_SECONDS: '60'
          ALLOW_FALLBACK: '1'
        run: python -u main.py

      - name: Save publication and duplicate-detection state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/seen.json
          key: radar-state-${{ github.run_id }}
